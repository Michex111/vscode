steps:
  - task: AzureKeyVault@2
    displayName: "Azure Key Vault: Get Secrets"
    inputs:
      azureSubscription: vscode
      KeyVaultName: vscode-build-secrets
      SecretsFilter: "macos-developer-certificate,macos-developer-certificate-key"

  # VALIDATION ONLY (do not merge): fail the first `codesign --timestamp` call for the server only (the app retry is covered by #344512)
  # with Apple's timestamp error, so the signing retry has to fire.
  - script: |
      set -e
      SHIM_DIR="$(Agent.TempDirectory)/codesign-shim"
      mkdir -p "$SHIM_DIR"
      REAL="$(command -v codesign)"
      cat > "$SHIM_DIR/codesign" <<EOF
      #!/bin/bash
      case " \$* " in
        *" --timestamp "*)
          case "\$*" in *vscode-server-darwin*) key=server ;; *) exec "$REAL" "\$@" ;; esac
          f="$SHIM_DIR/failed-\$key"
          if [ ! -f "\$f" ]; then
            touch "\$f"
            echo "CODESIGN-SHIM: forced timestamp failure for \$key" >&2
            echo "\${@: -1}: A timestamp was expected but was not found." >&2
            exit 1
          fi ;;
      esac
      exec "$REAL" "\$@"
      EOF
      chmod +x "$SHIM_DIR/codesign"
      echo "##vso[task.prependpath]$SHIM_DIR"
      echo "Installed codesign shim in front of $REAL"
    displayName: "VALIDATION: install failing codesign shim"
  - script: |
      set -e
      security create-keychain -p pwd $(agent.tempdirectory)/buildagent.keychain
      security default-keychain -s $(agent.tempdirectory)/buildagent.keychain
      security unlock-keychain -p pwd $(agent.tempdirectory)/buildagent.keychain
      echo "$(macos-developer-certificate)" | base64 -D > $(agent.tempdirectory)/cert.p12
      security import $(agent.tempdirectory)/cert.p12 -k $(agent.tempdirectory)/buildagent.keychain -P "$(macos-developer-certificate-key)" -T /usr/bin/codesign
      export CODESIGN_IDENTITY=$(security find-identity -v -p codesigning $(agent.tempdirectory)/buildagent.keychain | grep -oEi "([0-9A-F]{40})" | head -n 1)
      security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k pwd $(agent.tempdirectory)/buildagent.keychain
      DEBUG=electron-osx-sign* node build/darwin/sign.ts $(agent.builddirectory)
    displayName: Set Hardened Entitlements

  - script: |
      set -e
      export CODESIGN_IDENTITY=$(security find-identity -v -p codesigning $(agent.tempdirectory)/buildagent.keychain | grep -oEi "([0-9A-F]{40})" | head -n 1)
      node build/darwin/sign-server.ts $(Agent.BuildDirectory)/vscode-server-darwin-$(VSCODE_ARCH)
      node build/darwin/sign-server.ts $(Agent.BuildDirectory)/vscode-server-darwin-$(VSCODE_ARCH)-web
    displayName: Sign server binaries
